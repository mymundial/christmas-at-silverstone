<!doctype html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#041727" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles.css?v=2.0.0" />
  <title>Silverstone Mission Control</title>
</head>
<body>
  <div id="app" class="app-shell"></div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script>
    // Pass 6.80: retire legacy Mission Control service-worker caches.
    (() => {
      const cachePrefix = 'mission-control-sleigh-';

      if ('caches' in window) {
        caches.keys()
          .then(keys => Promise.all(
            keys.filter(key => key.startsWith(cachePrefix)).map(key => caches.delete(key))
          ))
          .catch(() => {});
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(registrations => Promise.all(registrations.map(registration => {
            const workers = [registration.active, registration.waiting, registration.installing].filter(Boolean);
            const isMissionControlWorker = workers.some(worker => {
              try { return new URL(worker.scriptURL).pathname === '/sw.js'; }
              catch { return false; }
            });
            return isMissionControlWorker ? registration.unregister() : Promise.resolve(false);
          })))
          .catch(() => {});
      }
    })();
  </script>
  <script src="./src/main.js?v=2.0.0" defer></script>
</body>
</html>
